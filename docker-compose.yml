services:
  portfolio:
    build: .
    container_name: portfolio-lieeexxx
    restart: unless-stopped
    networks:
      - portfolio
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.portfolio.rule=Host(`www.lieeexxx.fr`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls=true
      - traefik.http.services.portfolio.loadbalancer.server.port=8080
      - traefik.http.routers.portfolio-apex.rule=Host(`lieeexxx.fr`)
      - traefik.http.routers.portfolio-apex.entrypoints=websecure
      - traefik.http.routers.portfolio-apex.tls=true
      - traefik.http.routers.portfolio-apex.middlewares=portfolio-www
      - traefik.http.routers.portfolio-apex.service=portfolio
      - traefik.http.middlewares.portfolio-www.redirectregex.regex=^https://lieeexxx\.fr/(.*)
      - traefik.http.middlewares.portfolio-www.redirectregex.replacement=https://www.lieeexxx.fr/$${1}
      - traefik.http.middlewares.portfolio-www.redirectregex.permanent=true

networks:
  portfolio:
    name: portfolio
    driver: bridge
  proxy:
    external: true
