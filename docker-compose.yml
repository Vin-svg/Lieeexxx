services:
  portfolio:
    build: .
    container_name: portfolio-lieeexxx
    restart: unless-stopped
    networks:
      - portfolio
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.portfolio.rule=Host(`www.lieeexxx.fr`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls=true
      - traefik.http.services.portfolio.loadbalancer.server.port=8080

networks:
  portfolio:
    name: portfolio
    driver: bridge
  proxy:
    external: true
